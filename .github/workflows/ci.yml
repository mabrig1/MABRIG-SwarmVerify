name: SwarmVerify Checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Check source syntax
        run: npm run build
      - name: Run deterministic and mocked OpenRouter tests
        run: npm test
      - name: Bundle Worker without deploying or accessing secrets
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
